[project]
name = "lexdraft-engine"
version = "0.1.0"
description = "Deterministic legal drafting engine for Tamil Nadu courts"
requires-python = ">=3.11"
dependencies = [
    "python-dateutil>=2.9",
    "docxtpl>=0.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pypdf>=4.0",   # pagination-baseline: read page count + text layout from rendered PDFs
]
# The API layer (src/service). Kept optional so the core engine stays
# dependency-light; install with: pip install -e ".[service]"
service = [
    "fastapi>=0.110",
    "httpx>=0.27",       # FastAPI TestClient transport
    "uvicorn>=0.29",     # ASGI server for `uvicorn src.service.app:app`
]
# The format importer (tools/import_format.py) only — the running engine never
# needs it. Install with: pip install -e ".[import]"
import = [
    "anthropic>=1.0",    # transcribes a source format into a template spec
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

<!doctype html>
<html lang="en" data-theme="light" data-density="comfortable">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="LexDraft - practice management for Indian advocates" />
    <title>LexDraft</title>
    <script>
      // Apply the theme the user picked (saved by store/ui.ts under
      // 'lexdraft-ui') before first paint, so a reload never flashes or
      // flips to the OS theme. No saved choice yet: follow the OS. Density
      // preference is honoured too.
      (function () {
        var theme = 'light';
        try {
          // Legacy keys from the prototype; the store is the only source now.
          localStorage.removeItem('lexdraft-theme');
          localStorage.removeItem('lexdraft-version');
          localStorage.removeItem('lexdraft-theme-touched');
          var raw = localStorage.getItem('lexdraft-ui');
          var saved = raw ? JSON.parse(raw) : null;
          if (saved && saved.state && (saved.state.theme === 'light' || saved.state.theme === 'dark')) {
            theme = saved.state.theme;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
        try {
          var d = localStorage.getItem('lexdraft-density');
          if (d === 'compact' || d === 'comfortable' || d === 'spacious') {
            document.documentElement.setAttribute('data-density', d);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<!-- Shown by the Android app (capacitor.config.ts server.errorPath) when
     difai.sirahdigital.in can't be reached. Self-contained: no network. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DifAi - offline</title>
    <style>
      :root { color-scheme: light dark; --bg: #fff; --fg: #111; --muted: #666; }
      @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #f2f2f2; --muted: #9a9a9a; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
             font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { padding: 24px 16px; max-width: 360px; text-align: center; }
      h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 16px; }
      p { margin: 0 0 24px; color: var(--muted); }
      button { font: inherit; font-weight: 600; padding: 12px 28px; border-radius: 8px; border: 0;
               background: var(--fg); color: var(--bg); min-height: 44px; }
    </style>
  </head>
  <body>
    <main>
      <h1>DifAi</h1>
      <p>Can't reach DifAi. Check your internet connection and try again.</p>
      <button type="button" onclick="location.replace('https://difai.sirahdigital.in/')">Try again</button>
    </main>
  </body>
</html>
